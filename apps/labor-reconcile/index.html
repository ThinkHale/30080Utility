<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Hours Comparison</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
</head>
<body>
<link rel="stylesheet" href="../../shared/css/auth-overlay.css">
<link rel="stylesheet" href="../../shared/css/dash-link.css">
<div id="platformAuthOverlay" class="platform-auth-overlay">
  <div class="platform-auth-box">
    <h2>30080 Utility</h2>
    <p id="platformAuthMsg">Checking sign-in&hellip;</p>
    <form id="platformAuthForm" style="display:none;">
      <input type="email" id="platformAuthEmail" placeholder="Work email" required autocomplete="username">
      <input type="password" id="platformAuthPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../../shared/js/firebase-config.js"></script>
<script src="../../shared/js/auth-guard.js"></script>
<script src="../../shared/js/dash-link.js"></script>

    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
